[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-factory-growth-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "edgartools>=5.45.1",
    "langchain-core>=1.5.3",
    "langchain-google-genai>=4.3.2",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-postgres>=3.1.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "streamlit>=1.60.0",
    "tavily-python>=0.7.27",
    "yfinance>=1.5.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agents", "src/graph", "src/tools"]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "ruff>=0.16.1",
]
